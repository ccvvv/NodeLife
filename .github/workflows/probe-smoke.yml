name: NodeLife live upstream smoke test

on:
  push:
    branches: [main]
    paths:
      - "scripts/smoke_upstream.py"
      - ".github/workflows/probe-smoke.yml"
  workflow_dispatch:
    inputs:
      sample_size:
        description: Number of first published nodes to probe (1-50)
        required: true
        default: "10"

permissions:
  contents: read

concurrency:
  group: nodelife-live-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODELIFE_SMOKE_LIMIT: ${{ inputs.sample_size || '10' }}
    steps:
      - name: Check out NodeLife
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install pinned Mihomo
        run: |
          curl -fsSL --retry 3 \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-linux-amd64-v1.19.34.gz \
            -o /tmp/mihomo.gz
          gzip -dc /tmp/mihomo.gz > /usr/local/bin/mihomo
          chmod +x /usr/local/bin/mihomo
          mihomo -v

      - name: Fetch final subscription and run real HTTPS probes
        run: python scripts/smoke_upstream.py
