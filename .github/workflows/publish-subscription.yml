name: NodeLife publish plaintext subscription

on:
  push:
    branches: [main]
    paths:
      - "nodelife/**"
      - "scripts/v2raytun_subscription.py"
      - "tests/**"
      - "config/settings.yaml"
      - ".github/workflows/publish-subscription.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nodelife-publish-subscription
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODELIFE_PROBE_CONCURRENCY: "2"
    steps:
      - name: Check out NodeLife
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest
      - name: Install pinned Mihomo
        run: |
          curl -fsSL --retry 3 \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-linux-amd64-v1.19.34.gz \
            -o /tmp/mihomo.gz
          gzip -dc /tmp/mihomo.gz > /usr/local/bin/mihomo
          chmod +x /usr/local/bin/mihomo
          mihomo -v
      - name: Download AutoSubHub subscriptions and re-probe the complete deduplicated pool
        run: python -m nodelife.publisher
      - name: Generate V2RayTun share-link subscription
        run: python -m scripts.v2raytun_subscription
      - name: Publish refreshed subscriptions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/latest.yaml ]; then git add data/latest.yaml; fi
          if [ -f data/v2raytun.txt ]; then git add data/v2raytun.txt; fi
          if git diff --cached --quiet; then
            echo "Queue and subscription unchanged; no commit needed."
          else
            git commit -m "Publish refreshed NodeLife recheck subscriptions"
            for attempt in 1 2 3; do
              echo "Push attempt ${attempt}/3"
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                echo "Rebase conflict: refusing to overwrite remote changes."
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Queue state and subscription published successfully."
                exit 0
              fi
              echo "Push rejected; will retry against the newest main."
              sleep 2
            done
            echo "Unable to publish after 3 attempts."
            exit 1
          fi
