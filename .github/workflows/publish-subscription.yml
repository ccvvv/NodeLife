name: NodeLife publish plaintext subscription

on:
  push:
    branches: [main]
    paths:
      - "scripts/publish_subscription.py"
      - "nodelife/**"
      - "config/settings.yaml"
      - ".github/workflows/publish-subscription.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nodelife-publish-subscription
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODELIFE_PROBE_CONCURRENCY: "2"
    steps:
      - name: Check out NodeLife
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Run tests
        run: python -m pytest

      - name: Install pinned Mihomo
        run: |
          curl -fsSL --retry 3 \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-linux-amd64-v1.19.34.gz \
            -o /tmp/mihomo.gz
          gzip -dc /tmp/mihomo.gz > /usr/local/bin/mihomo
          chmod +x /usr/local/bin/mihomo
          mihomo -v

      - name: Recheck nodes and generate subscription
        run: python scripts/publish_subscription.py

      - name: Publish updated subscription
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.yaml
          if git diff --cached --quiet; then
            echo "Subscription unchanged; no commit needed."
          else
            git commit -m "Publish refreshed passing subscription"
            git push
          fi
