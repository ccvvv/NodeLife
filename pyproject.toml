[project]
name = "nodelife"
version = "0.1.0"
description = "Scheduled HTTPS availability rechecks for AutoSubHub final nodes"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0,<7.0",
  "requests>=2.32,<3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
